<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="800" height="720">
  <!-- Calico kitten peeking over an edge, paws in front (illustration drawn for the project) -->
  <defs>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7AEB8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F7AEB8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="headClip">
      <path d="M200 70 C 285 70 335 125 335 195 C 335 265 275 305 200 305 C 125 305 65 265 65 195 C 65 125 115 70 200 70 Z"/>
    </clipPath>
  </defs>

  <!-- Body behind the head -->
  <path d="M95 300 C 95 240 140 225 200 225 C 260 225 305 240 305 300 L 305 360 L 95 360 Z" fill="#3A2C2C"/>
  <path d="M150 260 C 170 240 230 240 250 260 L 260 360 L 140 360 Z" fill="#FFFFFF"/>

  <!-- Ears -->
  <path d="M88 150 L 92 40 L 175 92 Z" fill="#2E2424"/>
  <path d="M104 128 L 106 66 L 156 98 Z" fill="#F4A3B0"/>
  <path d="M312 150 L 308 40 L 225 92 Z" fill="#D9833F"/>
  <path d="M296 128 L 294 66 L 244 98 Z" fill="#F4A3B0"/>

  <!-- Head with calico patches -->
  <g clip-path="url(#headClip)">
    <rect x="60" y="60" width="280" height="250" fill="#FFFFFF"/>
    <path d="M60 60 L 200 60 C 190 110 175 150 150 175 C 120 200 85 210 60 215 Z" fill="#2E2424"/>
    <path d="M200 60 L 340 60 L 340 210 C 300 200 265 175 245 145 C 225 115 210 90 200 60 Z" fill="#D9833F"/>
    <path d="M250 60 L 340 60 L 340 130 C 310 120 280 95 250 60 Z" fill="#2E2424"/>
    <path d="M60 230 C 80 240 95 260 100 310 L 60 310 Z" fill="#D9833F"/>
  </g>

  <!-- Cheeks -->
  <ellipse cx="128" cy="232" rx="30" ry="20" fill="url(#cheek)"/>
  <ellipse cx="272" cy="232" rx="30" ry="20" fill="url(#cheek)"/>

  <!-- Eyes -->
  <ellipse cx="150" cy="190" rx="27" ry="30" fill="#FFFFFF"/>
  <ellipse cx="150" cy="192" rx="23" ry="26" fill="#8A9A5B"/>
  <ellipse cx="150" cy="194" rx="13" ry="18" fill="#1E1616"/>
  <circle cx="158" cy="182" r="7" fill="#FFFFFF"/>
  <circle cx="143" cy="203" r="3" fill="#FFFFFF"/>
  <ellipse cx="250" cy="190" rx="27" ry="30" fill="#FFFFFF"/>
  <ellipse cx="250" cy="192" rx="23" ry="26" fill="#8A9A5B"/>
  <ellipse cx="250" cy="194" rx="13" ry="18" fill="#1E1616"/>
  <circle cx="258" cy="182" r="7" fill="#FFFFFF"/>
  <circle cx="243" cy="203" r="3" fill="#FFFFFF"/>

  <!-- Nose and mouth -->
  <path d="M188 228 L 212 228 L 200 242 Z" fill="#E88A9A" stroke="#C86A7C" stroke-width="2" stroke-linejoin="round"/>
  <path d="M200 242 L 200 250 M 200 250 C 194 260 182 260 178 252 M 200 250 C 206 260 218 260 222 252" fill="none" stroke="#5A3A3A" stroke-width="3" stroke-linecap="round"/>

  <!-- Whiskers -->
  <g stroke="#B8A8A8" stroke-width="2" stroke-linecap="round">
    <path d="M120 240 L 60 232"/><path d="M120 248 L 62 252"/><path d="M122 256 L 68 270"/>
    <path d="M280 240 L 340 232"/><path d="M280 248 L 338 252"/><path d="M278 256 L 332 270"/>
  </g>

  <!-- Paws -->
  <g fill="#FFFFFF" stroke="#E5D6D6" stroke-width="2">
    <ellipse cx="140" cy="318" rx="38" ry="24"/>
    <ellipse cx="260" cy="318" rx="38" ry="24"/>
  </g>
  <g stroke="#D8C6C6" stroke-width="2" stroke-linecap="round">
    <path d="M128 326 L 128 336"/><path d="M152 326 L 152 336"/>
    <path d="M248 326 L 248 336"/><path d="M272 326 L 272 336"/>
  </g>
</svg>
